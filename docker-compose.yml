version: "3.9"

services:
  mysql:
    image: mysql:8.4

    container_name: identityhub-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: identityhub
      MYSQL_USER: identityhub
      MYSQL_PASSWORD: identityhub123

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: